[package]
name = "nif-wgpu"
version = "0.1.0"
edition = "2021"
authors = ["Romet Tagobert <sgzfxn@gmail.com>"]
description = "Renders Gamebryo NIF files with wgpu"
homepage = "https://github.com/amPerl/nif"
repository = "https://github.com/amPerl/nif"
license = "MIT"

[dependencies]
nif = { path = "../nif", features = ["glam"] }
wgpu = "29.0.4"
bytemuck = "1.25.2"
pollster = "0.4.0"
texpresso = "2.0.2"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "tga"] }

# the raw wgpu example draws into a window of its own, with no egui in the way
[dev-dependencies]
winit = "0.30.13"
