[package]
name = "nifty"
version = "0.6.0"
edition = "2021"
authors = ["Romet Tagobert <sgzfxn@gmail.com>"]
description = "A NIF inspector"
license = "MIT"
publish = false

[dependencies]
nif = { path = "../nif", features = ["glam", "facet"] }
nif-wgpu = { path = "../nif-wgpu" }
eframe = { version = "0.35.0", features = ["wgpu"] }
egui_dock = "0.20.1"
egui_ltreeview = "0.8.0"
egui-phosphor = "0.13.0"
bytemuck = "1.25.2"
facet-reflect = "0.50.0-rc.6"
image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "tga"] }

# opening a file through a dialog and watching one on disk are both native only, and the
# browser has no clock that `std::time::Instant` can read
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"
wasm-bindgen-futures = "0.4.56"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.83", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "console",
] }

